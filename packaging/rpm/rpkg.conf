# rpkg configuration for this package directory.
#
# rpkg reads this file automatically when it builds the SRPM from a git
# checkout, which is how the COPR project (allamiro/syslogcef) builds every
# push to main. It only registers the project macro file that lets the spec
# generate Source0 from git instead of downloading it from PyPI.
[rpkg]
user_macros = ${pkg_path}/rpkg.macros
