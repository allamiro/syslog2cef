name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

# Least privilege: no job here writes to the repository, and an explicit
# block also stops a permissive default at the org or repo level from
# applying (CodeQL "workflow does not contain permissions").
permissions:
  contents: read

jobs:
  test:
    # Pinned: ubuntu-latest moved to 26.04, where actions/setup-python has
    # no CPython 3.9 build, failing the declared-minimum matrix entry.
    # Revisit when 3.9 support is dropped.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Every supported CPython: the declared minimum (3.9), the
        # release-build version (3.12), the container base (3.13), the newest
        # stable CPython (3.14), and the versions between.
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[test,fuzz]
      - name: Run tests
        # The suite includes tests/test_zipapp_safe.py, which imports the
        # package from inside a zip archive — the package-data / zipimport
        # smoke test that differs across versions (notably 3.9's legacy
        # zipimport) — so every matrix Python exercises it here.
        run: pytest

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Ruff
        run: |
          pip install ruff
          ruff check .
      - name: ShellCheck packaging scripts
        run: shellcheck packaging/debian/build-deb.sh packaging/rpm/build-rpm.sh
      - name: Run tests from the sdist
        # The RPM %check runs the suite from the PyPI sdist, which has no
        # CHANGELOG, packaging files or keys. Catch tests that need a git
        # checkout here instead of in the release workflow.
        run: |
          pip install build pytest
          python -m build --sdist --outdir "$RUNNER_TEMP/dist"
          mkdir "$RUNNER_TEMP/sdist"
          tar -xzf "$RUNNER_TEMP"/dist/*.tar.gz -C "$RUNNER_TEMP/sdist" --strip-components=1
          cd "$RUNNER_TEMP/sdist" && python -m pytest -q

  rpm:
    # The same Fedora build the release runs (and a Fedora reviewer would):
    # sdist -> SRPM -> RPM with %check running the suite, then rpmlint in
    # strict mode with only the reviewed false positives filtered. Catches
    # spec, packaging and sdist problems on the pull request rather than
    # at release time.
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - name: Install build tools
        run: |
          dnf install -y rpm-build rpmdevtools rpmlint git glibc-langpack-en \
            python3-devel python3-build python3-pip \
            python3-setuptools python3-wheel \
            pyproject-rpm-macros systemd-rpm-macros
      - uses: actions/checkout@v5
      - name: Build and lint the RPM
        run: bash packaging/rpm/build-rpm.sh

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
      - name: Build image
        run: docker build -t syslog2cef:ci .
      - name: Smoke test image
        run: |
          out=$(echo '<166>Jan  1 12:34:56 router1 %ASA-6-302013: Built inbound TCP connection' | docker run --rm -i syslog2cef:ci)
          echo "$out"
          case "$out" in
            CEF:0*) ;;
            *) echo "image did not produce CEF output" >&2; exit 1 ;;
          esac
