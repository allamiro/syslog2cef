name: Mirror container image

# Copies existing tags of ghcr.io/<owner>/syslog2cef to the image's name
# before 0.4.1, ghcr.io/<owner>/syslogcef, without rebuilding: the copy
# has the same digest for every platform. Releases publish to both names
# themselves; this is for tags released before that (0.4.1 to 0.6.1).

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Space-separated tags to copy, e.g. '0.6.1 latest'"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy tags to the old name
        env:
          TAGS: ${{ inputs.tags }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            case "$tag" in
              ""|*[!A-Za-z0-9._-]*) echo "invalid tag: '$tag'" >&2; exit 1 ;;
            esac
            src="ghcr.io/${OWNER}/syslog2cef:${tag}"
            dst="ghcr.io/${OWNER}/syslogcef:${tag}"
            docker buildx imagetools create --tag "$dst" "$src"
            echo "copied $src -> $dst"
            docker buildx imagetools inspect "$dst" | head -3
          done
