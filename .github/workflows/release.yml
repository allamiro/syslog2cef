name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-python:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run tests
        run: |
          python -m pip install --upgrade pip
          pip install .[test]
          pytest

      - name: Build distributions
        run: |
          pip install build
          python -m build

      - name: Sign distributions
        if: env.GPG_PRIVATE_KEY != ''
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          for artifact in dist/*.tar.gz dist/*.whl; do
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" \
              --detach-sign --armor "$artifact"
          done

      - uses: actions/upload-artifact@v6
        with:
          name: python-dist
          path: dist/*

  build-rpm:
    name: Build RPM
    runs-on: ubuntu-latest
    container: fedora:44
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
    steps:
      - name: Install build tools
        run: |
          dnf install -y rpm-build rpmdevtools rpm-sign rpmlint gnupg2 git \
            dnf5-plugins glibc-langpack-en \
            python3-devel python3-build python3-pip \
            python3-setuptools python3-wheel \
            pyproject-rpm-macros systemd-rpm-macros

      - uses: actions/checkout@v7

      - name: Build and lint RPM
        run: |
          # The tag is the version; the spec must agree with it.
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^Version:.*/Version:        ${VERSION}/" packaging/rpm/syslog2cef.spec
          bash packaging/rpm/build-rpm.sh

      - name: Sign RPM
        if: env.GPG_PRIVATE_KEY != ''
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: bash packaging/rpm/sign-rpm.sh

      - uses: actions/upload-artifact@v6
        with:
          name: rpm-dist
          path: rpms/*

  build-standalone:
    name: Build zipapp, Debian package, and source zip
    runs-on: ubuntu-latest
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build standalone zipapp
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          pip install . --target build/zipapp --no-compile
          rm -rf build/zipapp/bin build/zipapp/*.dist-info
          mkdir -p out
          python -m zipapp build/zipapp \
            -m "syslogcef.cli:main" \
            -p "/usr/bin/env python3" \
            -c -o "out/syslog2cef-${VERSION}.pyz"
          echo "conversion smoke test:" \
            && echo '<166>Jan  1 12:34:56 fw1 %ASA-6-302013: Built inbound src=1.2.3.4' \
              | "out/syslog2cef-${VERSION}.pyz"

      - name: Build Debian package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash packaging/debian/build-deb.sh "$VERSION" "out/syslog2cef-${VERSION}.pyz" out
          dpkg-deb --info "out/syslog2cef_${VERSION}-1_all.deb"

      - name: Build source zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git archive --format=zip --prefix="syslog2cef-${VERSION}/" \
            -o "out/syslog2cef-${VERSION}-source.zip" HEAD

      - name: Sign artifacts
        if: env.GPG_PRIVATE_KEY != ''
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          for artifact in out/*.pyz out/*.deb out/*.zip; do
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" \
              --detach-sign --armor "$artifact"
          done

      - uses: actions/upload-artifact@v6
        with:
          name: standalone-dist
          path: out/*

  build-apk:
    name: Build Alpine APK
    runs-on: ubuntu-latest
    container: alpine:3.21
    env:
      ABUILD_PRIVATE_KEY: ${{ secrets.ABUILD_PRIVATE_KEY }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
    steps:
      - name: Install build tools
        run: apk add --no-cache abuild build-base python3 py3-pip gnupg git

      - uses: actions/checkout@v7

      - name: Build APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          # abuild refuses to run as root
          adduser -D builder
          addgroup builder abuild

          # Signing key: use the repository secret, or an ephemeral key when absent
          mkdir -p /home/builder/.abuild
          if [ -n "$ABUILD_PRIVATE_KEY" ]; then
            printf '%s\n' "$ABUILD_PRIVATE_KEY" > /home/builder/.abuild/syslogcef.rsa
            cp packaging/apk/syslogcef.rsa.pub /home/builder/.abuild/syslogcef.rsa.pub
          else
            su builder -c "abuild-keygen -an" \
              && mv /home/builder/.abuild/*.rsa /home/builder/.abuild/syslogcef.rsa \
              && mv /home/builder/.abuild/*.rsa.pub /home/builder/.abuild/syslogcef.rsa.pub
          fi
          echo 'PACKAGER_PRIVKEY="/home/builder/.abuild/syslogcef.rsa"' > /home/builder/.abuild/abuild.conf
          cp /home/builder/.abuild/syslogcef.rsa.pub /etc/apk/keys/

          # Build the zipapp that the APK ships
          pip install . --target build/zipapp --no-compile --break-system-packages
          rm -rf build/zipapp/bin build/zipapp/*.dist-info
          python3 -m zipapp build/zipapp \
            -m "syslogcef.cli:main" \
            -p "/usr/bin/env python3" \
            -c -o "packaging/apk/syslog2cef-${VERSION}.pyz"

          cp packaging/rpm/syslogcef.1 packaging/apk/
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" packaging/apk/APKBUILD
          chown -R builder packaging/apk /home/builder/.abuild
          su builder -c "cd packaging/apk && abuild checksum && abuild -r"

          mkdir -p out
          cp /home/builder/packages/packaging/*/syslog2cef-*.apk out/

      - name: Sign APK with GPG (detached)
        if: env.GPG_PRIVATE_KEY != ''
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          for artifact in out/*.apk; do
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" \
              --detach-sign --armor "$artifact"
          done

      - uses: actions/upload-artifact@v6
        with:
          name: apk-dist
          path: out/*

  build-docker:
    name: Build and push container image
    # Pushing overwrites `latest`, so only push once the tests and every
    # other release build have passed.
    needs: [build-python, build-rpm, build-standalone, build-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/syslog2cef
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github-release:
    name: Create GitHub release
    needs: [build-python, build-rpm, build-standalone, build-apk, build-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          # Only the package builds. build-docker also uploads a build
          # record artifact (*.dockerbuild) that is not a release asset.
          pattern: '*-dist'
          path: artifacts
          merge-multiple: true

      - name: Generate and sign checksums
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd artifacts
          sha256sum *.tar.gz *.whl *.rpm *.deb *.pyz *.zip *.apk > SHA256SUMS
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" \
              --detach-sign --armor SHA256SUMS
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            artifacts/*

      # Fedora package review (#68): post this release's Spec and SRPM URLs
      # to the Review Request bug, which also makes the Fedora Review
      # Service re-run its automated review. Opt-in: set the repository
      # variable FEDORA_REVIEW_BUG to the bug number and the secret
      # BUGZILLA_API_KEY (bugzilla.redhat.com > Preferences > API Keys).
      # Delete the variable once the package is approved.
      - name: Update the Fedora review request
        if: vars.FEDORA_REVIEW_BUG != ''
        env:
          BUGZILLA_API_KEY: ${{ secrets.BUGZILLA_API_KEY }}
          REVIEW_BUG: ${{ vars.FEDORA_REVIEW_BUG }}
        run: |
          if [ -z "$BUGZILLA_API_KEY" ]; then
            echo "::warning::FEDORA_REVIEW_BUG is set but BUGZILLA_API_KEY is not; skipping"
            exit 0
          fi
          srpm="$(cd artifacts && ls syslog2cef-*.src.rpm)"
          base="https://github.com/${GITHUB_REPOSITORY}"
          comment="$(printf '%s\n\nSpec URL: %s\nSRPM URL: %s\n' \
            "Updated to ${GITHUB_REF_NAME#v} (${base}/releases/tag/${GITHUB_REF_NAME})." \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/packaging/rpm/syslog2cef.spec" \
            "${base}/releases/download/${GITHUB_REF_NAME}/${srpm}")"
          jq -n --arg comment "$comment" '{comment: $comment}' \
            | curl --fail-with-body -sS -X POST \
                -H "Content-Type: application/json" \
                -H "X-BUGZILLA-API-KEY: ${BUGZILLA_API_KEY}" \
                --data @- \
                "https://bugzilla.redhat.com/rest/bug/${REVIEW_BUG}/comment"

  publish-pypi:
    name: Publish to PyPI
    # A PyPI version can never be replaced, so publish only once every
    # other artifact for the tag has built; a failed RPM, Debian, APK or
    # image build can then be fixed and the same version re-released.
    needs: [build-python, build-rpm, build-standalone, build-apk, build-docker]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist

      - name: Remove non-distribution files
        run: rm -f dist/*.asc

      - name: Publish (API token)
        if: env.PYPI_API_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      - name: Publish (trusted publishing)
        if: env.PYPI_API_TOKEN == ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
